name: kvarta

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kvarta
      POSTGRES_PASSWORD: kvarta_local
      POSTGRES_DB: kvarta
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvarta -d kvarta"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres18_data:
